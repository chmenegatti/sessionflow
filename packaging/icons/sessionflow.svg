<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- SessionFlow: um fluxo que liga duas sessões (nós). Cores do app:
       fundo do tema escuro, acento sky-400 → violet-400. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2033"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <path d="M152 164 H300 C368 164 380 244 318 256 L194 256 C132 268 144 348 212 348 H360"
        fill="none" stroke="url(#flow)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="152" cy="164" r="34" fill="#38bdf8"/>
  <circle cx="360" cy="348" r="34" fill="#a78bfa"/>
  <circle cx="152" cy="164" r="13" fill="#0b0d14"/>
  <circle cx="360" cy="348" r="13" fill="#0b0d14"/>
</svg>
