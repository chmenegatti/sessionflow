# Testes e builds a cada push e pull request, nos três sistemas.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências do sistema (GTK4 + WebKitGTK 6.0)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Bindings e frontend
        run: |
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          cd frontend && npm ci && npm run typecheck && npm test && npm run build
      - run: go vet ./...
      - run: go test -race ./...
      - name: Autoteste do binário
        run: |
          go build -tags production -o bin/sessionflow .
          ./bin/sessionflow --selftest

  # Windows e macOS: testes Go e o build do app no próprio sistema (WebView2
  # e WKWebView só compilam ali). O frontend é o mesmo do Linux.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Bindings e frontend
        run: |
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          cd frontend && npm ci && npm run build
      - run: go vet ./...
      - run: go test ./...
      - name: Build do app
        run: wails3 build
      - name: Versão
        run: |
          find bin -maxdepth 4 -type f | head
          exe=$(find bin -maxdepth 4 -type f \( -iname 'sessionflow' -o -iname 'sessionflow.exe' \) | head -1)
          "$exe" --version | tee version.txt
          grep -q "SessionFlow" version.txt
          "$exe" --selftest | tee selftest.txt
          grep -q "SELFTEST OK" selftest.txt
