# Testes e builds a cada push e pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências do sistema (GTK4 + WebKitGTK 6.0)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Bindings e frontend
        run: |
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          cd frontend && npm ci && npm run typecheck && npm run build
      - run: go vet ./...
      - run: go test -race ./...
